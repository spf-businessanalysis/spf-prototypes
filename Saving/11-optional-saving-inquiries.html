<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استفسارات نظام الادخار</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .spf-navbar .user-toggle,
        .spf-navbar .notification-bell,
        .spf-navbar .user-badge { display: none !important; }
        .spf-sidebar { display: none !important; }
        .spf-main { max-width: 1120px; margin-inline: auto; }

        /* ===== الترويسة ===== */
        .exec-hero {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 26px;
            color: #fff;
            background: linear-gradient(120deg, #0f3d2a 0%, #14532d 55%, #1c6b3c 100%);
            box-shadow: 0 22px 48px -30px rgba(15, 61, 42, .8);
        }
        .exec-hero::after {
            content: "";
            position: absolute;
            inset-block-start: -180px;
            inset-inline-start: -110px;
            width: 420px; height: 420px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 50%;
            box-shadow: 0 0 0 58px rgba(255, 255, 255, .03);
        }
        .exec-hero-inner {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between;
            gap: 30px; flex-wrap: wrap;
        }
        .exec-eyebrow {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: .82rem; font-weight: 700;
            padding: 5px 12px; border-radius: 999px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .22);
        }
        .exec-hero h3 { margin: 12px 0 8px; font-weight: 800; line-height: 1.5; }
        .exec-hero p { margin: 0 0 16px; max-width: 640px; color: rgba(255, 255, 255, .84); line-height: 1.95; }
        .hero-btn {
            display: inline-flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255, 255, 255, .35);
            background: rgba(255, 255, 255, .1);
            color: #fff; border-radius: 11px;
            padding: 8px 18px; font-size: .88rem; font-weight: 700;
            font-family: inherit; cursor: pointer; transition: all .15s ease;
        }
        .hero-btn:hover { background: #fff; color: #14532d; border-color: #fff; }
        .exec-ring {
            display: grid; place-items: center;
            width: 130px; height: 130px; border-radius: 50%;
            background: conic-gradient(#d4a437 var(--pct, 0%), rgba(255, 255, 255, .16) 0);
            flex: 0 0 auto;
        }
        .exec-ring span {
            display: grid; place-items: center; line-height: 1.25;
            width: 104px; height: 104px; border-radius: 50%;
            background: #0f3d2a; text-align: center;
        }
        .exec-ring b { font-size: 1.5rem; font-weight: 800; }
        .exec-ring small { font-size: .71rem; color: rgba(255, 255, 255, .7); }

        /* ===== المحاور ===== */
        .theme-block { margin-bottom: 24px; }
        .theme-head {
            display: flex; align-items: center; gap: 11px;
            padding: 12px 17px; border-radius: 13px;
            background: #eef4f1; border: 1px solid #dce7e1;
            font-weight: 800; color: #14532d; cursor: pointer;
        }
        .theme-head .th-icon { color: #1c6b3c; }
        .theme-head .th-count { margin-inline-start: auto; font-weight: 400; font-size: .84rem; color: #5c6f66; }
        .theme-head .th-caret { transition: transform .2s ease; color: #5c6f66; }
        .theme-block.collapsed .th-caret { transform: rotate(-90deg); }
        .theme-block.collapsed .theme-body { display: none; }
        .theme-body { padding-top: 12px; display: grid; gap: 11px; }

        /* ===== بطاقة الاستفسار ===== */
        .q-card {
            background: #fff; border: 1px solid #e4ebe7; border-radius: 15px;
            padding: 16px 18px 14px;
            border-inline-start: 5px solid #cbd6d0;
        }
        .q-card.has-reply { border-inline-start-color: #1b7a45; }
        .q-top { display: flex; gap: 13px; align-items: flex-start; }
        .q-num {
            flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px;
            display: grid; place-items: center; font-weight: 800; font-size: .82rem;
            background: #eef4f1; color: #14532d;
        }
        .q-text { font-weight: 700; line-height: 2; margin: 0; color: #23342c; }
        .q-badge {
            flex: 0 0 auto; font-size: .76rem; font-weight: 700;
            padding: 4px 12px; border-radius: 999px; white-space: nowrap;
            background: #f1f3f5; color: #5c6771; border: 1px solid #dfe3e7;
        }
        .q-card.has-reply .q-badge { background: #e2f4e9; color: #1b6f40; border-color: #bfe4cd; }
        .q-tools { margin-top: 11px; }
        .q-btn {
            border: 1px solid #d8e3dd; background: #fff; color: #355044;
            border-radius: 9px; padding: 4px 14px; font-size: .82rem; font-weight: 700; cursor: pointer;
        }
        .q-btn:hover { border-color: #14532d; background: #f2f8f4; }
        .q-log { margin-top: 11px; display: grid; gap: 7px; }
        .log-item {
            background: #f7faf8; border: 1px solid #e6eeea; border-radius: 10px;
            padding: 9px 12px; font-size: .88rem; line-height: 1.85;
        }
        .log-meta { font-size: .76rem; color: #7b8b83; margin-top: 4px; }

        @media print {
            .spf-navbar, .q-tools, .hero-btn, .no-print { display: none !important; }
            .q-card, .exec-hero { break-inside: avoid; }
            .theme-block.collapsed .theme-body { display: grid !important; }
            .exec-hero { color: #000; background: none; border: 1px solid #ccc; }
            .exec-hero p, .exec-ring small { color: #333; }
        }
        @media (max-width: 767px) {
            .exec-hero { padding: 22px 20px; }
            .exec-ring { width: 108px; height: 108px; }
            .exec-ring span { width: 86px; height: 86px; }
        }
    </style>
</head>
<body data-user-role="saver">
    <div id="navbarPlaceholder"></div>
    <div id="sidebarPlaceholder"></div>

    <main class="spf-main">

        <section class="exec-hero">
            <div class="exec-hero-inner">
                <div>
                    <span class="exec-eyebrow"><i class="fas fa-gavel"></i> نقاط مرفوعة لاتخاذ قرار</span>
                    <h3>استفسارات نظام الادخار</h3>
                    <p>
                        النقاط التي يتوقف عليها استكمال تصميم النظام وبناؤه، مجمّعة في محاور رئيسية.
                        يمكن تدوين الرد على كل نقطة أثناء الاجتماع، ويبقى محفوظاً بعد إغلاق المتصفح.
                    </p>
                    <button class="hero-btn" onclick="exportAnswers()">
                        <i class="fas fa-download"></i> تنزيل ملف الردود
                    </button>
                </div>
                <div class="exec-ring" id="pctRing" style="--pct: 0%">
                    <span>
                        <b id="pctValue">0%</b>
                        <small>تم الرد عليها</small>
                    </span>
                </div>
            </div>
        </section>

        <div id="themesHost"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script>
    (function () {
        'use strict';

        var REPLIES_KEY = 'spf-saving-inq-replies-v3';

        var THEMES = [
            { id: 'roi',    name: 'العائد من الاستثمار',                 icon: 'fa-chart-line' },
            { id: 'payout', name: 'الاستحقاق والصرف وسداد الالتزامات',   icon: 'fa-money-check-dollar' },
            { id: 'intl',   name: 'المغادرة والتحويل الدولي والتوكيل',    icon: 'fa-earth-americas' },
            { id: 'saving', name: 'الادخار الإلزامي والاختياري',          icon: 'fa-hand-holding-dollar' }
        ];

        var INQUIRIES = [

            /* ---------- العائد من الاستثمار ---------- */
            { id: 'ROI-01', theme: 'roi',
              q: 'ما آلية توزيع العائد من الاستثمار على المدخرات الإلزامية والاختيارية بشكل شهري، وآلية التطبيق على المبالغ المخصومة من الحساب عند سداد الالتزامات؟' },
            { id: 'ROI-02', theme: 'roi',
              q: 'هل يُحتسب العائد على المبالغ المتوقع تحصيلها إلزامياً (نسبة 9%) أم على ما تم تحصيله فعلياً؟' },

            /* ---------- الاستحقاق والصرف وسداد الالتزامات ---------- */
            { id: 'PAY-01', theme: 'payout',
              q: 'هل يقتصر الصرف على حالات الاستحقاق المنصوص عليها دون أي صرف جزئي؟' },
            { id: 'PAY-02', theme: 'payout',
              q: 'هل توجد مدة تقادم لاستحقاق المدخرات التي لم يُقدَّم طلب صرف بشأنها، وما أثر ذلك على استمرار العوائد وعلى الإشعارات ومعالجة الرصيد؟' },
            { id: 'PAY-03', theme: 'payout',
              q: 'كيف تُعالَج مدخرات المدخر المتوفى: تحديد الورثة الفعليين، وآلية التواصل والتحقق، وطريقة تقديم الطلب ومعالجته؟' },
            { id: 'PAY-04', theme: 'payout',
              q: 'هل تتم تسوية الالتزامات القائمة على المدخر قبل الصرف وبأي ترتيب أولوية عند تعددها؟' },
            { id: 'PAY-05', theme: 'payout',
              q: 'ما ضوابط الخصم التلقائي من حساب الادخار لسداد الالتزامات: مصدر الخصم (الرصيد الاختياري أم الإلزامي أيضاً)، والحد الأدنى للمبلغ القابل للخصم، وقبول السداد الجزئي من عدمه؟' },

            /* ---------- المغادرة والتحويل الدولي والتوكيل ---------- */
            { id: 'INT-01', theme: 'intl',
              q: 'ما آلية تحويل المدخرات للعامل بعد مغادرته السلطنة: القناة البنكية المعتمدة، وعملة التحويل ومعامل الصرف، ومن يتحمل رسوم التحويل والوساطة، ومدة التنفيذ، وإجراء التعامل مع ارتداد الحوالة؟' },
            { id: 'INT-02', theme: 'intl',
              q: 'ما ضوابط توكيل الأشخاص للتعامل مع حساب الادخار: توثيق التوكيل والجهة المعتمدة له، والتحقق منه إذا كان الموكِّل خارج السلطنة، ومصير التوكيل بعد وفاة الموكِّل؟' },

            /* ---------- الادخار الإلزامي والاختياري ---------- */
            { id: 'SAV-01', theme: 'saving',
              q: 'هل يجوز للعامل غير العماني الإيداع في الادخار الاختياري بنفسه فيما يتجاوز الحد الإلزامي أم يقتصر الإيداع على جهة العمل؟' },
            { id: 'SAV-02', theme: 'saving',
              q: 'كيف يُطبق السقف السنوي والحد الأدنى للإيداع: على كل مصدر إيداع على حدة أم على الحساب ككل؟' },
            { id: 'SAV-03', theme: 'saving',
              q: 'كيف يُحتسب المبلغ الإضافي بنسبة (8%) سنوياً؟ (يفرض على كل جهة عمل لم تؤد الاشتراكات المقررة على أساس الأجور الحقيقية لغير العمانيين، أو امتنعت عن سداد الاشتراكات المستحقة للصندوق خلال الأجل المنصوص عليه في المادة (١٠١) من هذه اللائحة، مبلغ إضافي يقدر بنسبة (٨٪) ثمانية في المائة سنويا من إجمالي الاشتراكات الواجب سدادها للصندوق، ما لم تكن هناك أسباب قهرية محددة لدى جهة العمل لذلك وفقا للضوابط التي يضعها المجلس في هذا الشأن، ويتم حساب المبالغ الإضافية تراكميا عن المدة الواقعة بين تاريخ استحقاق الصندوق للاشتراكات وتاريخ سدادها.)' },
            { id: 'SAV-04', theme: 'saving',
              q: 'ما ضوابط الخروج من نظام الادخار الاختياري وأثره على الرصيد القائم، وهل يجوز إعادة التسجيل بعد الخروج؟' }
        ];

        /* ================= التخزين ================= */
        var replies = {};
        try { replies = JSON.parse(localStorage.getItem(REPLIES_KEY) || '{}'); } catch (e) { replies = {}; }
        function saveReplies() { try { localStorage.setItem(REPLIES_KEY, JSON.stringify(replies)); } catch (e) {} }

        function nowStamp() {
            var d = new Date();
            var p = function (n) { return String(n).padStart(2, '0'); };
            return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear()
                 + ' - ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }
        function esc(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function hasReply(id) { return !!(replies[id] && replies[id].length); }

        function countLabel(n) {
            if (n === 1) return 'نقطة واحدة';
            if (n === 2) return 'نقطتان';
            if (n <= 10) return n + ' نقاط';
            return n + ' نقطة';
        }

        /* ================= العرض ================= */
        function renderLog(id) {
            var list = replies[id] || [];
            if (!list.length) return '';
            return list.map(function (r, i) {
                return '<div class="log-item"><div>' + esc(r.text) + '</div>'
                     + '<div class="log-meta">' + esc(r.at)
                     + ' <a href="#" class="text-danger ms-2" data-del="' + id + '|' + i + '">حذف</a>'
                     + '</div></div>';
            }).join('');
        }

        function renderCard(inq, index) {
            var answered = hasReply(inq.id);
            return ''
              + '<article class="q-card' + (answered ? ' has-reply' : '') + '" data-id="' + inq.id + '">'
              +   '<div class="q-top">'
              +     '<span class="q-num">' + String(index).padStart(2, '0') + '</span>'
              +     '<p class="q-text flex-grow-1">' + esc(inq.q) + '</p>'
              +     '<span class="q-badge">' + (answered ? 'تم الرد' : 'بانتظار الرد') + '</span>'
              +   '</div>'
              +   '<div class="q-tools">'
              +     '<button class="q-btn" data-act="reply"><i class="fas fa-pen me-1"></i>تدوين رد</button>'
              +   '</div>'
              +   '<div class="mt-2 d-none" data-box="' + inq.id + '">'
              +     '<textarea class="form-control mb-2" rows="3" placeholder="اكتب الرد على هذه النقطة..."></textarea>'
              +     '<button class="btn btn-sm btn-spf" data-act="save">حفظ الرد</button> '
              +     '<button class="btn btn-sm btn-spf-outline" data-act="cancel">إلغاء</button>'
              +   '</div>'
              +   '<div class="q-log" data-log="' + inq.id + '">' + renderLog(inq.id) + '</div>'
              + '</article>';
        }

        function renderAll() {
            var counter = 0;
            document.getElementById('themesHost').innerHTML = THEMES.map(function (theme) {
                var items = INQUIRIES.filter(function (i) { return i.theme === theme.id; });
                if (!items.length) return '';
                var cards = items.map(function (inq) { counter++; return renderCard(inq, counter); }).join('');
                return ''
                  + '<section class="theme-block" data-theme="' + theme.id + '">'
                  +   '<div class="theme-head">'
                  +     '<i class="fas ' + theme.icon + ' th-icon"></i>'
                  +     '<span>' + theme.name + '</span>'
                  +     '<span class="th-count">' + countLabel(items.length) + '</span>'
                  +     '<i class="fas fa-chevron-down th-caret"></i>'
                  +   '</div>'
                  +   '<div class="theme-body">' + cards + '</div>'
                  + '</section>';
            }).join('');
            updateRing();
        }

        function updateRing() {
            var total = INQUIRIES.length;
            var done = INQUIRIES.filter(function (i) { return hasReply(i.id); }).length;
            var pct = total ? Math.round(done * 100 / total) : 0;
            document.getElementById('pctValue').textContent = pct + '%';
            document.getElementById('pctRing').style.setProperty('--pct', pct + '%');
        }

        function refreshCard(card, id) {
            if (!card) return;
            var answered = hasReply(id);
            card.classList.toggle('has-reply', answered);
            card.querySelector('.q-badge').textContent = answered ? 'تم الرد' : 'بانتظار الرد';
            card.querySelector('[data-log="' + id + '"]').innerHTML = renderLog(id);
            updateRing();
        }

        /* ================= التفاعل ================= */
        document.addEventListener('click', function (e) {
            var head = e.target.closest('.theme-head');
            if (head) { head.parentElement.classList.toggle('collapsed'); return; }

            var del = e.target.closest('[data-del]');
            if (del) {
                e.preventDefault();
                var parts = del.getAttribute('data-del').split('|');
                var did = parts[0], idx = parseInt(parts[1], 10);
                if (replies[did]) {
                    replies[did].splice(idx, 1);
                    if (!replies[did].length) delete replies[did];
                    saveReplies();
                    refreshCard(document.querySelector('.q-card[data-id="' + did + '"]'), did);
                }
                return;
            }

            var btn = e.target.closest('[data-act]');
            if (!btn) return;
            var card = btn.closest('.q-card');
            if (!card) return;
            var id = card.getAttribute('data-id');
            var act = btn.getAttribute('data-act');
            var box = card.querySelector('[data-box="' + id + '"]');

            if (act === 'reply') {
                box.classList.toggle('d-none');
                if (!box.classList.contains('d-none')) box.querySelector('textarea').focus();
                return;
            }
            if (act === 'cancel') {
                box.querySelector('textarea').value = '';
                box.classList.add('d-none');
                return;
            }
            if (act === 'save') {
                var ta = box.querySelector('textarea');
                var text = ta.value.trim();
                if (!text) { alert('يرجى كتابة الرد أولاً.'); return; }
                if (!replies[id]) replies[id] = [];
                replies[id].push({ text: text, at: nowStamp() });
                saveReplies();
                ta.value = '';
                box.classList.add('d-none');
                refreshCard(card, id);
            }
        });

        /* ================= تنزيل الردود ================= */
        window.exportAnswers = function () {
            var payload = { generatedAt: nowStamp(), version: 3, replies: replies };
            var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'inquiry-answers.json';
            a.click();
            URL.revokeObjectURL(a.href);
        };

        function mergePayload(data) {
            if (!data || !data.replies) return;
            Object.keys(data.replies).forEach(function (k) {
                var local = replies[k] || [];
                (data.replies[k] || []).forEach(function (r) {
                    var dup = local.some(function (x) { return x.text === r.text && x.at === r.at; });
                    if (!dup) local.push(r);
                });
                replies[k] = local;
            });
            saveReplies();
        }

        /* ================= التشغيل ================= */
        renderAll();

        fetch('inquiry-answers.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) { if (data) { mergePayload(data); renderAll(); } })
            .catch(function () {});
    })();
    </script>
</body>
</html>
