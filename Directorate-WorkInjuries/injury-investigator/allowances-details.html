<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الطلب — موظف قسم التحقيق في إصابات العمل</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<script src="../shared/config.js"></script>
<script src="../shared/data-users.js"></script>
<script src="../shared/data-allowances.js"></script>
<script src="../shared/data-disability.js"></script>
<script src="../shared/data-chronic.js"></script>
<script src="../shared/data-appeals.js"></script>
<script src="../shared/data-licensing.js"></script>
<script src="../shared/data-sessions.js"></script>
<script src="../shared/data-disability-retirement.js"></script>
<script src="../shared/data-external-entities.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/workflow-stages.js"></script>
<script src="../shared/layout.js"></script>
<script src="../shared/utils.js"></script>
<script>
initLayout({ role: 'injury-investigator', activePage: 'allowances-list' });
const params = new URLSearchParams(window.location.search);
const req = (WI_DATA.allowances || []).find(r => r.id === params.get('id')) || (WI_DATA.allowances || [])[0];
currentRequestId = req.id;
const me = WI_DATA.users?.injury_investigator?.name || 'مستخدم غير معروف';
const isCheckedOutByMe = req.checkedOutBy === me;
setBreadcrumb([{ label: 'بدلات الانقطاع', page: 'allowances-list' }, { label: `تفاصيل ${req.id}` }]);

document.addEventListener('DOMContentLoaded', () => {
  const isSamePerson = req.applicant?.civil && req.insured?.civil && req.applicant.civil === req.insured.civil;
  const canAct = (req.status === 'قيد التحقيق — إصابات العمل' || req.status.includes('بانتظار تعيين')) && isCheckedOutByMe;
  const ext = req.externalEntity || null;
  const fromExternal = !!(ext && ext.submittedDate);
  const actions = canAct ? [
    'إعادة الطلب الى جهة العمل',
    'اعادة الطلب الى المؤمن عليه',
    'تحويل إلى قسم الأمراض المهنية للاختصاص',
    /* يُتاح إرجاع الطلب إلى الجهة الخارجية المخولة فقط إذا كانت هي من رفعته */
    ...(fromExternal ? ['إعادة الطلب إلى الجهة الخارجية المخولة'] : []),
    'توصية بالموافقة وتوجيه لرئيس القسم',
    'توصية بالرفض وتوجيه لرئيس القسم',
  ] : [];

  const injury = req.injury || {};
  const isWork = req.type === 'إصابة عمل';
  const atts   = req.attachments || [];
  const notes  = req.notes || [];
  const tl     = req.timeline || [];

  getContent().innerHTML = `
    <div class="pg-head">
      <div>
        <h1>تفاصيل الطلب</h1>
        <p>رقم الطلب: <strong style="font-family:monospace;color:var(--primary)">${req.id}</strong></p>
      </div>
      <div class="pg-acts">
        ${!req.checkedOutBy && (req.status === 'قيد التحقيق — إصابات العمل' || req.status.includes('بانتظار تعيين'))
          ? `<button class="btn btn-primary" onclick="doCheckout()">${ICONS.lock} حجز الطلب</button>`
          : isCheckedOutByMe
            ? `<button class="btn btn-secondary" onclick="doCheckin()">${ICONS.unlock} تحرير الطلب</button>`
            : req.checkedOutBy
              ? `<span style="font-size:12px;color:var(--warning);padding:8px 14px;border:1px solid var(--warning-l);border-radius:var(--rsm);background:var(--warning-l)">${ICONS.lock} محجوز بواسطة: ${req.checkedOutBy}</span>`
              : ''}
        <button class="btn btn-secondary btn-sm" id="discussion-flag-btn" onclick="toggleDiscussionFlag()" title="تعليم للنقاش">${ICONS.bell} تعليم للنقاش</button>
        <button class="btn btn-secondary" onclick="window.location.href='allowances-list.html'">${ICONS.arrow_left} رجوع</button>
      </div>
    </div>

    ${!isCheckedOutByMe && (req.status === 'قيد التحقيق — إصابات العمل' || req.status.includes('بانتظار تعيين')) ? `
    <div class="alert alert-w">
      ${ICONS.warn}
      <span>يجب حجز الطلب أولاً لتتمكن من اتخاذ إجراء على هذا الطلب وتجنب العمل المتزامن.</span>
    </div>` : ''}

    <!-- ملخص الطلب -->
    <div class="card" style="border-right:4px solid var(--primary)">
      <div class="pb-c">
        <div class="req-summary-grid">
          <div><div class="flbl" style="margin-bottom:4px">رقم الطلب</div><div style="font-size:15px;font-weight:800;color:var(--primary);font-family:monospace">${req.id}</div></div>
          <div><div class="flbl" style="margin-bottom:4px">حالة الطلب</div>${statusBadge(req.status)}</div>
          <div><div class="flbl" style="margin-bottom:4px">تاريخ التقديم</div><div style="font-size:12.5px">${formatDate(req.submitDate)}</div></div>
          <div><div class="flbl" style="margin-bottom:4px">مقدم الطلب</div><div style="font-size:12.5px;font-weight:600">${req.applicant?.name || req.applicant?.role || '—'}</div><div style="font-size:11px;color:var(--text3)">${req.applicant?.role || ''}</div></div>
          <div><div class="flbl" style="margin-bottom:4px">آخر تحديث</div><div style="font-size:12px;color:var(--text2)">${req.lastUpdate || '—'}</div></div>
          <div><div class="flbl" style="margin-bottom:4px">آخر تحديث بواسطة</div><div style="font-size:12px;color:var(--text2)">${req.lastUpdatedBy || '—'}</div></div>
          <div><div class="flbl" style="margin-bottom:4px">تاريخ الإغلاق المتوقع</div><div style="font-size:12px">${formatDate(req.expectedClosureDate) || '—'}</div></div>
          <div><div class="flbl" style="margin-bottom:4px">الأيام المتبقية حتى الإغلاق</div><div style="font-size:12px;font-weight:600;color:${(req.remainingDays||0)<7?'var(--danger)':(req.remainingDays||0)<30?'var(--warning)':'var(--text2)'}">${req.remainingDays!=null?req.remainingDays+' يوم':'—'}</div></div>
        </div>
      </div>
    </div>

    ${renderWorkflowPath(req, 'allowances')}
    ${renderInsuredSummaryCards(req.insured?.civil || req.applicant?.civil, req.id)}

    ${isSamePerson ? `
    <!-- بيانات المؤمن عليه / المستفيد (نفس الشخص) -->
    <div class="card card-ro">
      <div class="ph"><h3><div class="pico bl">${ICONS.user}</div>بيانات المؤمن عليه / المستفيد</h3><span style="font-size:11px;color:var(--text3)">مجلوبة تلقائياً</span></div>
      <div class="pb">
        <div class="fg fg-3">
          <div class="fgrp"><label class="flbl">صفة مقدم الطلب</label><div class="fro">${req.applicant.role || '—'}</div></div>
          <div class="fgrp"><label class="flbl">الاسم الكامل</label><div class="fro">${req.insured.name || req.applicant.name || '—'}</div></div>
          <div class="fgrp"><label class="flbl">الرقم المدني</label><div class="fro" style="font-family:monospace">${req.insured.civil || '—'}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ الميلاد</label><div class="fro">${formatDate(req.insured.dob)}</div></div>
          <div class="fgrp"><label class="flbl">الجنس</label><div class="fro">${req.insured.gender || '—'}</div></div>
          <div class="fgrp"><label class="flbl">الجنسية</label><div class="fro">${req.insured.nationality || '—'}</div></div>
          <div class="fgrp"><label class="flbl">رقم الهاتف</label><div class="fro">${normalizeDisplay(req.applicant.phone || req.insured.phone, '96890000000')}</div></div>
          <div class="fgrp"><label class="flbl">البريد الإلكتروني</label><div class="fro">${normalizeDisplay(req.applicant.email || req.insured.email, 'noreply@spf-proto.om')}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ انتهاء البطاقة الشخصية</label><div class="fro">${formatDate(req.insured.civilExpiry || req.applicant.civilExpiry)}</div></div>
          <div class="fgrp"><label class="flbl">المحافظة / الولاية</label><div class="fro">${normalizeDisplay(req.applicant.region)}${req.applicant.wilayat ? ' — ' + req.applicant.wilayat : ''}</div></div>
          <div class="fgrp"><label class="flbl">الحالة التأمينية</label><div class="fro"><span class="badge ${req.insured.insuranceStatus === 'نشط' ? 'b-approved' : 'b-rejected'}">${req.insured.insuranceStatus || '—'}</span></div></div>
          <div class="fgrp"><label class="flbl">تاريخ التسجيل فى الصندوق</label><div class="fro">${formatDate(req.insured.regDate)}</div></div>
        </div>
      </div>
    </div>` : `
    <!-- بيانات مقدم الطلب -->
    <div class="card">
      <div class="ph"><h3><div class="pico bl">${ICONS.user}</div>بيانات مقدم الطلب</h3></div>
      <div class="pb">
        <div class="fg fg-3">
          <div class="fgrp"><label class="flbl">صفة مقدم الطلب</label><div class="fro">${req.applicant.role || '—'}</div></div>
          <div class="fgrp"><label class="flbl">الاسم الكامل</label><div class="fro">${req.applicant.name || '—'}</div></div>
          <div class="fgrp"><label class="flbl">الرقم المدني</label><div class="fro" style="font-family:monospace">${req.applicant.civil || '—'}</div></div>
          <div class="fgrp"><label class="flbl">رقم الهاتف</label><div class="fro">${normalizeDisplay(req.applicant.phone || req.insured.phone, '96890000000')}</div></div>
          <div class="fgrp"><label class="flbl">البريد الإلكتروني</label><div class="fro">${normalizeDisplay(req.applicant.email || req.insured.email, 'noreply@spf-proto.om')}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ انتهاء البطاقة الشخصية</label><div class="fro">${formatDate(req.applicant.civilExpiry)}</div></div>
          <div class="fgrp"><label class="flbl">المحافظة / الولاية</label><div class="fro">${normalizeDisplay(req.applicant.region)}${req.applicant.wilayat ? ` — ${req.applicant.wilayat}` : ''}</div></div>
          <div class="fgrp"><label class="flbl">الدولة</label><div class="fro">${normalizeDisplay(req.applicant.country)}</div></div>
        </div>
      </div>
    </div>

    <!-- بيانات المؤمن عليه -->
    <div class="card card-ro">
      <div class="ph"><h3><div class="pico bl">${ICONS.user}</div>بيانات المؤمن عليه / المستفيد</h3><span style="font-size:11px;color:var(--text3)">مجلوبة تلقائياً</span></div>
      <div class="pb">
        <div class="fg fg-4">
          <div class="fgrp"><label class="flbl">الاسم الكامل</label><div class="fro">${req.insured.name || '—'}</div></div>
          <div class="fgrp"><label class="flbl">الرقم المدني</label><div class="fro" style="font-family:monospace">${req.insured.civil || '—'}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ الميلاد</label><div class="fro">${formatDate(req.insured.dob)}</div></div>
          <div class="fgrp"><label class="flbl">الجنس</label><div class="fro">${req.insured.gender || '—'}</div></div>
          <div class="fgrp"><label class="flbl">الجنسية</label><div class="fro">${req.insured.nationality || '—'}</div></div>
          <div class="fgrp"><label class="flbl">رقم الهاتف</label><div class="fro">${normalizeDisplay(req.applicant.phone || req.insured.phone, '96890000000')}</div></div>
          <div class="fgrp"><label class="flbl">البريد الإلكتروني</label><div class="fro">${normalizeDisplay(req.applicant.email || req.insured.email, 'noreply@spf-proto.om')}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ انتهاء البطاقة الشخصية</label><div class="fro">${formatDate(req.insured.civilExpiry)}</div></div>
          <div class="fgrp"><label class="flbl">الحالة التأمينية</label><div class="fro"><span class="badge ${req.insured.insuranceStatus === 'نشط' ? 'b-approved' : 'b-rejected'}">${req.insured.insuranceStatus || '—'}</span></div></div>
          <div class="fgrp"><label class="flbl">تاريخ التسجيل فى الصندوق</label><div class="fro">${formatDate(req.insured.regDate)}</div></div>
        </div>
      </div>
    </div>`}

    <!-- بيانات جهة العمل -->
    <div class="card card-ro">
      <div class="ph"><h3><div class="pico tl">${ICONS.building}</div>بيانات جهة العمل</h3><span style="font-size:11px;color:var(--text3)">مجلوبة تلقائياً</span></div>
      <div class="pb">
        <div class="fg fg-3">
          <div class="fgrp"><label class="flbl">اسم جهة العمل</label><div class="fro" style="font-weight:700">${req.employer.name || '—'}</div></div>
          <div class="fgrp"><label class="flbl">رقم السجل التجاري</label><div class="fro" style="font-family:monospace">${req.employer.cr || '—'}</div></div>
          <div class="fgrp"><label class="flbl">رقم المنشأة</label><div class="fro" style="font-family:monospace">${normalizeDisplay(req.employer.establishment)}</div></div>
          <div class="fgrp"><label class="flbl">المسمى الوظيفي</label><div class="fro">${req.employer.jobTitle || '—'}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ الالتحاق بالعمل</label><div class="fro">${formatDate(req.employer.joinDate)}</div></div>
          <div class="fgrp"><label class="flbl">موقع العمل / الفرع</label><div class="fro">${req.employer.location || '—'}</div></div>
          ${req.employer.phone ? `<div class="fgrp"><label class="flbl">هاتف جهة العمل</label><div class="fro">${req.employer.phone}</div></div>` : ''}
          <div class="fgrp"><label class="flbl">القطاع</label><div class="fro">${req.employer.sector || '—'}</div></div>
          <div class="fgrp"><label class="flbl">نوع جهة العمل</label><div class="fro">${req.employer.employerType || '—'}</div></div>
          ${req.employer.branch ? `<div class="fgrp"><label class="flbl">الفرع</label><div class="fro">${req.employer.branch.id} — ${req.employer.branch.name} — ${req.employer.branch.state}</div></div>` : ''}
        </div>
      </div>
    </div>

    <!-- بيانات الإصابة / المرض -->
    <div class="card card-ro">
      <div class="ph"><h3><div class="pico rd">${ICONS.medical}</div>بيانات ${isWork ? 'الإصابة' : 'المرض المهني'}</h3></div>
      <div class="pb">
        <div class="fg fg-3">
          <div class="fgrp"><label class="flbl">نوع الحالة</label><div class="fro">${normalizeDisplay(isWork ? (injury.caseType || 'إصابة عمل') : (injury.caseType || injury.diagnosis || 'مرض مهني'))}</div></div>
          <div class="fgrp"><label class="flbl">${isWork ? 'تاريخ الإصابة' : 'تاريخ تشخيص المرض'}</label><div class="fro">${formatDate(injury.incidentDate || injury.firstSuspicion)}</div></div>
          ${isWork ? `
          <div class="fgrp"><label class="flbl">الجزء المصاب</label><div class="fro">${injury.bodyPart || '—'}</div></div>
          <div class="fgrp span-full"><label class="flbl">مكان الواقعة</label><div class="fro">${injury.location || '—'}</div></div>
          <div class="fgrp span-full"><label class="flbl">وصف تفصيلي للواقعة</label><div class="fro" style="min-height:60px;align-items:flex-start;padding-top:10px">${injury.description || '—'}</div></div>
          ${injury.witnesses === 'نعم' ? `<div class="fgrp"><label class="flbl">الشهود</label><div class="fro">${injury.witnessNames || '—'}</div></div>` : ''}
          ${injury.accidentDirection ? `<div class="fgrp"><label class="flbl">اتجاه الحادث</label><div class="fro">${injury.accidentDirection}</div></div>` : ''}
          ` : `
          <div class="fgrp span-full"><label class="flbl">المواد / العوامل المسببة</label><div class="fro">${injury.chemicalAgents || '—'}</div></div>
          <div class="fgrp"><label class="flbl">مدة التعرض المهني</label><div class="fro">${injury.exposureDuration || '—'}</div></div>
          <div class="fgrp span-full"><label class="flbl">وصف بيئة العمل</label><div class="fro">${normalizeDisplay(injury.workEnvironment)}</div></div>
          `}
          ${injury.insuredStatus ? `<div class="fgrp"><label class="flbl">حالة المؤمن عليه</label><div class="fro">${injury.insuredStatus}</div></div>` : ''}
        </div>
      </div>
    </div>

    ${fromExternal ? `
    <!-- نتيجة الجهة الخارجية المخولة -->
    <div class="card" style="border-right:4px solid var(--accent)">
      <div class="ph">
        <h3><div class="pico tl">${ICONS.building}</div>نتيجة الجهة الخارجية المخولة بالتحقيق</h3>
        <span style="font-size:11px;color:var(--text3)">للاطلاع — القرار يبقى لموظف قسم التحقيق ورئيس القسم</span>
      </div>
      <div class="pb">
        <div class="fg fg-4">
          <div class="fgrp"><label class="flbl">الجهة الخارجية</label><div class="fro" style="font-weight:700">${ext.entityName || '—'}</div></div>
          <div class="fgrp"><label class="flbl">المستخدم القائم بالتحقيق</label><div class="fro">${ext.checkedOutBy || '—'}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ حجز الطلب</label><div class="fro">${formatDate(ext.checkedOutDate) || '—'}</div></div>
          <div class="fgrp"><label class="flbl">تاريخ التوجيه للقسم</label><div class="fro">${formatDate(ext.submittedDate) || '—'}</div></div>
          <div class="fgrp"><label class="flbl">المهلة التعاقدية</label><div class="fro">${ext.slaDays ? ext.slaDays + ' يوم عمل' : '—'}</div></div>
          <div class="fgrp"><label class="flbl">الأيام المنقضية</label><div class="fro" style="color:${(ext.elapsedDays || 0) > (ext.slaDays || 0) ? 'var(--danger)' : 'var(--text2)'};font-weight:600">${ext.elapsedDays != null ? ext.elapsedDays + ' يوم' : '—'}${(ext.elapsedDays || 0) > (ext.slaDays || 0) ? ' (تجاوز المهلة)' : ''}</div></div>
          <div class="fgrp"><label class="flbl">مرات الإعادة إلى الجهة</label><div class="fro">${ext.returnCount || 0}</div></div>
          <div class="fgrp"><label class="flbl">عدد الزيارات الميدانية</label><div class="fro">${(req.fieldVisits || []).length}</div></div>
          <div class="fgrp"><label class="flbl">مخالفة المؤمن عليه</label><div class="fro"><span class="badge ${ext.insuredViolation === 'نعم' ? 'b-rejected' : 'b-approved'}">${ext.insuredViolation || '—'}</span></div></div>
          ${ext.insuredViolationType ? `<div class="fgrp"><label class="flbl">طبيعة المخالفة</label><div class="fro">${ext.insuredViolationType}</div></div>` : ''}
          <div class="fgrp"><label class="flbl">مخالفة صاحب العمل</label><div class="fro"><span class="badge ${ext.employerViolation === 'نعم' ? 'b-rejected' : 'b-approved'}">${ext.employerViolation || '—'}</span></div></div>
          <div class="fgrp"><label class="flbl">معايير المشاركة مع وزارة العمل</label><div class="fro"><span class="badge ${req.molShare?.eligible ? 'b-returned' : 'b-draft'}">${req.molShare?.eligible ? 'مستوفية' : 'غير مستوفية'}</span></div></div>
        </div>
        <div class="alert alert-i" style="margin-top:12px;margin-bottom:0">
          ${ICONS.info}
          <span>لم تُبدِ الجهة الخارجية المخولة أي توصية بالقبول أو الرفض — إبداء التوصية من اختصاص موظف قسم التحقيق.</span>
        </div>
      </div>
    </div>` : ''}

    <!-- تقرير التحقيق — قابل للتعديل عند الحجز، للاطلاع فقط في حالات أخرى -->
    ${canAct ? `
    <div class="card">
      <div class="ph">
        <h3><div class="pico pu">${ICONS.search}</div>تقرير التحقيق</h3>
        <span style="font-size:11px;background:#ede9fe;color:#7c3aed;padding:1px 7px;border-radius:10px;font-weight:600">قابل للتعديل</span>
      </div>
      <div class="pb">
        <div class="fg" style="gap:14px">
          <div class="fgrp">
            <label class="flbl">ملخص التحقيق</label>
            <textarea class="fc" id="inv-summary" rows="5" placeholder="اكتب ملخص تحقيقك وما توصلت إليه...">${req.investigation?.summary || ''}</textarea>
          </div>
          <div class="fgrp span-full">
            <label class="flbl">ملاحظاتك وتوصيتك المبدئية</label>
            <textarea class="fc" rows="3" placeholder="اكتب توصيتك وملاحظاتك قبل رفعها لرئيس القسم...">${req.investigation?.employeeNotes || ''}</textarea>
          </div>
          <div style="border-top:1px dashed var(--border);padding-top:14px;margin-top:4px">
            <div class="flbl" style="margin-bottom:10px;font-size:11.5px;color:var(--primary);font-weight:700">— نتائج التحقيق —</div>
            <div class="fg fg-2" style="gap:12px">
              <div class="fgrp">
                <label class="flbl">هل المؤمن عليه مخالف؟</label>
                <select class="fc" id="insured-violation" onchange="document.getElementById('violation-type-group').style.display=this.value==='نعم'?'':'none'">
                  <option value="لا">لا</option>
                  <option value="نعم">نعم</option>
                </select>
              </div>
              <div class="fgrp" id="violation-type-group" style="display:none">
                <label class="flbl">طبيعة المخالفة</label>
                <select class="fc" id="violation-type">
                  <option>تعمّد إصابة النفس</option>
                  <option>تحت تأثير المؤثرات العقلية</option>
                  <option>عدم الالتزام بإجراءات السلامة</option>
                </select>
              </div>
              <div class="fgrp">
                <label class="flbl">هل ثبتت مخالفة صاحب العمل لإجراءات السلامة؟</label>
                <select class="fc" id="employer-violation">
                  <option value="لا">لا</option>
                  <option value="نعم">نعم</option>
                </select>
              </div>
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" style="width:auto;align-self:flex-start" onclick="showToast('تم حفظ تقرير التحقيق مؤقتاً','s')">${ICONS.check} حفظ مؤقت</button>
        </div>
      </div>
    </div>` : req.investigation ? `
    <div class="card card-cum">
      <div class="ph"><h3><div class="pico pu">${ICONS.search}</div>تقرير التحقيق</h3><span class="stg-lbl">مرحلة التحقيق</span></div>
      <div class="pb">
        <div class="fg" style="gap:14px">
          <div class="fgrp"><label class="flbl">ملخص التحقيق</label><div class="fro" style="min-height:70px;align-items:flex-start;padding-top:10px">${req.investigation.summary || '—'}</div></div>
          <div class="fg fg-3">
            <div class="fgrp"><label class="flbl">توصية الموظف</label><div class="fro">${req.investigation.employeeRecommendation ? `<span class="badge ${req.investigation.employeeRecommendation === 'موافقة' ? 'b-approved' : 'b-rejected'}">${req.investigation.employeeRecommendation}</span>` : '—'}</div></div>
            <div class="fgrp span-2"><label class="flbl">ملاحظات الموظف</label><div class="fro">${req.investigation.employeeNotes || '—'}</div></div>
          </div>
        </div>
      </div>
    </div>` : ''}

    <!-- الزيارات الميدانية -->
    <div class="card card-cum">
      <div class="ph">
        <h3><div class="pico or">${ICONS.map}</div>الزيارات الميدانية والمعاينات</h3>
        ${canAct ? `<button class="btn btn-secondary btn-xs" onclick="openAddVisitModal()">${ICONS.plus} إضافة زيارة</button>` : ''}
      </div>
      <div class="pb">
        ${(req.fieldVisits || []).length === 0
          ? '<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px">لا توجد زيارات ميدانية مسجلة</div>'
          : (req.fieldVisits || []).map(v => renderFieldVisitCard(v)).join('')}
      </div>
    </div>

    <!-- المرفقات -->
    <div class="card">
      <div class="ph">
        <h3><div class="pico or">${ICONS.upload}</div>المرفقات <span style="font-size:11px;font-weight:400;color:var(--text3)">(${atts.length} مرفق)</span></h3>
      </div>
      <div class="pb">
        ${atts.length === 0 ? '<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px">لا توجد مرفقات</div>' : atts.map(att => {
          const ext = att.name?.split('.').pop()?.toLowerCase() || 'oth';
          const icoMap = { pdf: 'file', doc: 'file', docx: 'file', jpg: 'img', jpeg: 'img', png: 'img' };
          return `<div class="att-row"><div class="att-ico ${icoMap[ext] || 'oth'}">${ICONS.file}</div><div class="att-info"><div class="att-name">${att.name}</div><div class="att-meta">${att.type} · رفعه: ${att.uploadedBy} (${att.role}) · ${att.uploadDate} · ${att.size || ''}</div></div><div class="att-acts"><button class="ibtn" title="تحميل" onclick="showToast('جارٍ تحميل الملف...','i')">${ICONS.download}</button></div></div>`;
        }).join('')}
      </div>
    </div>

    <!-- الملاحظات التشغيلية -->
    <div class="card op-notes-card collapsed" data-notes-init="0">
      <div class="ph op-notes-head" onclick="toggleOperationalNotes(this.closest('.op-notes-card'))">
        <h3><div class="pico gy">${ICONS.note}</div>الملاحظات التشغيلية <span style="font-size:11px;font-weight:400;color:var(--text3)">(لا تغيّر حالة الطلب)</span></h3>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="op-notes-chevron">${ICONS.arrow_left}</span>
          <button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();openAddNoteModal(currentRequestId)">${ICONS.plus} إضافة ملاحظة</button>
        </div>
      </div>
      <div class="pb">
        ${notes.length === 0 ? '<div style="text-align:center;padding:16px;color:var(--text3);font-size:12px">لا توجد ملاحظات تشغيلية</div>' : notes.map(n => `<div class="note-item"><div class="note-av">${n.author?.charAt(0) || '؟'}</div><div class="note-c"><div class="note-hd"><span class="note-auth">${n.author}</span><span class="note-role">${n.role}</span><span class="note-time">${n.time}</span></div><div class="note-txt">${n.text}</div></div></div>`).join('')}
        <div style="margin-top:10px;display:flex;gap:8px">
          <textarea class="fc" id="quick-note-input" placeholder="أكتب ملاحظة سريعة..." rows="2" style="flex:1"></textarea>
          <button class="btn btn-secondary btn-sm" style="align-self:flex-end" onclick="quickAddNote()">حفظ</button>
        </div>
      </div>
    </div>

    ${actions.length > 0 ? `
    <!-- الإجراءات المتاحة -->
    <div class="dp">
      <div class="ph"><h3><div class="pico bl">${ICONS.pen}</div>الإجراءات المتاحة</h3></div>
      <div class="dp-body">
        <div class="fgrp">
          <label class="flbl">الملاحظات <span style="font-weight:400;color:var(--text3)">(اختياري)</span></label>
          <textarea class="fc" id="decision-notes" placeholder="أكتب ملاحظاتك وتوصيتك النهائية هنا..." rows="3"></textarea>
        </div>
        <div class="fgrp">
          <label class="flbl">إرفاق ملفات داعمة للقرار <span style="font-weight:400;color:var(--text3)">(اختياري)</span></label>
          ${renderModernUploadComponent({ idPrefix: 'decision-att', subTitle: 'يمكن رفع عدة ملفات دفعة واحدة' })}
        </div>
        <div class="dp-acts">
          ${actions.map(a => `<button class="btn ${WI_CONFIG.actionStyles[a] || 'btn-secondary btn-sm'}" onclick="executeAction('${a}')">${a}</button>`).join('')}
        </div>
      </div>
    </div>` : ''}

    <!-- السجل الزمني -->
    <div class="card">
      <div class="ph"><h3><div class="pico gy">${ICONS.clock}</div>السجل الزمني الكامل للطلب</h3></div>
      <div class="pb">
        ${renderTimelineList(tl)}
      </div>
    </div>`;
});

let discussionFlagged = false;
function toggleDiscussionFlag() {
  discussionFlagged = !discussionFlagged;
  const btn = document.getElementById('discussion-flag-btn');
  if (discussionFlagged) {
    btn.className = 'btn btn-warning btn-sm';
    btn.innerHTML = `${ICONS.bell} معلّم للنقاش`;
    showToast('تم تعليم الطلب للنقاش في الاجتماع الأسبوعي القادم — سيظل الطلب معلقاً لحين المناقشة', 'w', 5000);
  } else {
    btn.className = 'btn btn-secondary btn-sm';
    btn.innerHTML = `${ICONS.bell} تعليم للنقاش`;
    showToast('تم إلغاء علامة النقاش', 'i');
  }
}

function executeAction(a) {
  if (a === 'إعادة الطلب إلى الجهة الخارجية المخولة') {
    openModal({
      title: `إعادة الطلب إلى ${req.externalEntity?.entityName || 'الجهة الخارجية المخولة'}`,
      body: `
        <div class="alert alert-i" style="margin-top:10px">${ICONS.info}
          <span>يعود الطلب إلى حالة «قيد التحقيق — جهة خارجية مخولة»، وتظهر ملاحظتك للجهة أعلى شاشة تفاصيل الطلب.</span>
        </div>
        <div class="fgrp" style="margin-top:10px">
          <label class="flbl">ملاحظة الإعادة <span class="req">*</span></label>
          <textarea class="fc" id="ext-return-note" rows="3" placeholder="اذكر ما يلزم استكماله من الجهة الخارجية المخولة..."></textarea>
        </div>`,
      footer: `
        <button class="btn btn-warning" onclick="confirmExternalReturn()">${ICONS.check} إعادة الطلب</button>
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>`
    });
    return;
  }
  if (a === 'إعادة الطلب الى جهة العمل' || a === 'اعادة الطلب الى المؤمن عليه' || a === 'Send request to employer' || a === 'Send request to insured' || a === 'طلب استيفاء بيانات من مقدم الطلب') {
    const returnTarget = a === 'إعادة الطلب الى جهة العمل' || a === 'Send request to employer'
      ? 'employer'
      : a === 'اعادة الطلب الى المؤمن عليه' || a === 'Send request to insured'
        ? 'insured'
        : 'both';
    const returnTargetLabel = returnTarget === 'employer'
      ? 'صاحب العمل'
      : returnTarget === 'insured'
        ? 'المؤمن عليه'
        : 'المؤمن عليه وصاحب العمل';
    openModal({
      title: `إعادة الطلب إلى ${returnTargetLabel} لاستيفاء البيانات`,
      body: `
        <div class="fgrp" style="margin-top:10px">
          <label class="flbl">سبب الإعادة <span class="req">*</span></label>
          <textarea class="fc" id="return-reason" rows="3" placeholder="اذكر البيانات المطلوبة..."></textarea>
        </div>`,
      footer: `
        <button class="btn btn-warning" onclick="confirmReturn('${returnTarget}')">${ICONS.check} إرسال</button>
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>`
    });
    return;
  }
  showToast(`جارٍ تنفيذ: ${a}`, 'i');
  setTimeout(() => {
    showToast(`تم تنفيذ الإجراء: ${a}`, 's');
    setTimeout(() => window.location.href = 'allowances-list.html', 1500);
  }, 1200);
}

function confirmReturn(returnTarget = 'both') {
  const reason = document.getElementById('return-reason')?.value?.trim();
  if (!reason) { showToast('يرجى كتابة سبب الإعادة', 'w'); return; }
  const targetLabel = returnTarget === 'employer'
    ? 'صاحب العمل'
    : returnTarget === 'insured'
      ? 'المؤمن عليه'
      : 'المؤمن عليه وصاحب العمل';
  closeModal();
  showToast(`تم إعادة الطلب إلى ${targetLabel} لاستيفاء البيانات`, 'w');
  setTimeout(() => window.location.href = 'allowances-list.html', 1500);
}

function confirmExternalReturn() {
  const note = document.getElementById('ext-return-note')?.value?.trim();
  if (!note) { showToast('يرجى كتابة ملاحظة الإعادة', 'w'); return; }
  if (req.externalEntity) {
    req.externalEntity.returnCount = (req.externalEntity.returnCount || 0) + 1;
    req.externalEntity.lastReturnNote = note;
    req.externalEntity.submittedDate = '';
  }
  closeModal();
  showToast(`تم إعادة الطلب إلى ${req.externalEntity?.entityName || 'الجهة الخارجية المخولة'} مع الملاحظة`, 'w');
  setTimeout(() => window.location.href = 'allowances-list.html', 1500);
}

function doCheckout() { showToast('تم حجز الطلب بنجاح', 's'); }
function doCheckin() { showToast('تم تحرير الطلب', 'i'); }
function openAddAttachmentModal() { showToast('إضافة مرفق', 'i'); }
function quickAddNote() {
  const v = document.getElementById('quick-note-input')?.value?.trim();
  if (!v) { showToast('يرجى كتابة الملاحظة', 'w'); return; }
  showToast('تم حفظ الملاحظة', 's');
  document.getElementById('quick-note-input').value = '';
}
function toggleOperationalNotes(card) {
  card.classList.toggle('collapsed');
  if (card.getAttribute('data-notes-init') === '0') card.setAttribute('data-notes-init', '1');
}
</script>
</body>
</html>
